{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block auth_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background: linear-gradient(135deg, var(--bg-base) 0%, var(--bg-elevated) 100%);">
    <div class="card" style="width:100%;max-width:420px;text-align:center;box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); border-top: 4px solid var(--accent);">
        <h1 class="brand" style="font-size:36px;margin-bottom:12px;justify-content:center;">💻 Study4u</h1>
        <p style="color:var(--text-muted);margin-bottom:32px;font-size:15px;">Welcome back to your workspace</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="email" id="email" class="form-control" placeholder="Email Address" required>
            <input type="password" id="password" class="form-control" placeholder="Password" required>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:16px;margin-top:10px;">Login</button>
        </form>
        
        <div style="margin-top:24px;font-size:14px;color:var(--text-muted);">
            Don't have an account? <a href="{{ url_for('register') }}" style="color:var(--cyan);text-decoration:none;font-weight:600;">Register here</a>
        </div>
    </div>
</div>

<script>
async function handleLogin(e) {
    e.preventDefault();
    const res = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        })
    });
    const data = await res.json();
    if(data.success) window.location.href = data.redirect;
    else alert(data.error);
}
</script>
{% endblock %}
